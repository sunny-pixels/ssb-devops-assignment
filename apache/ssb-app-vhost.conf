# Apache virtual host for the SSB inventory app (XAMPP for Linux).
#
# Install (see docs/08-bonus.md):
#   sudo cp apache/ssb-app-vhost.conf /opt/lampp/etc/extra/
#   echo 'Include etc/extra/ssb-app-vhost.conf' | sudo tee -a /opt/lampp/etc/httpd.conf
#   sudo /opt/lampp/bin/httpd -t -D SSL -D PHP && sudo systemctl reload lampp
#
# Once any name-based vhost exists, Apache sends requests that match no ServerName to
# the FIRST vhost. So the first block re-creates the stock site (htdocs, /phpmyadmin,
# /ssb-app/) for the IP address and localhost; the second is the dedicated app site.

# Hide exact Apache/OpenSSL/PHP versions in headers and error pages (server-wide)
ServerTokens Prod
ServerSignature Off

# 1) Default – unchanged behaviour for http://192.168.198.133/ and http://localhost/
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/opt/lampp/htdocs"
</VirtualHost>

# 2) Dedicated site – http://ssb-app.local/ serves the app at the web root
<VirtualHost *:80>
    ServerName ssb-app.local
    DocumentRoot "/opt/lampp/htdocs/ssb-app"

    <Directory "/opt/lampp/htdocs/ssb-app">
        Options -Indexes +FollowSymLinks
        # the app's .htaccess files (deny inc/, block .env/.sql/…) must keep working
        AllowOverride All
        Require all granted
    </Directory>

    # phpMyAdmin is a global alias in XAMPP – not part of this site
    <Location "/phpmyadmin">
        Require all denied
    </Location>

    <IfModule headers_module>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "same-origin"
        Header always unset X-Powered-By
        Header unset X-Powered-By
    </IfModule>

    # Separate logs per site make troubleshooting easier
    ErrorLog  "logs/ssb-app-error_log"
    CustomLog "logs/ssb-app-access_log" combined
</VirtualHost>
